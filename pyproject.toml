[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scales-codex-pet"
version = "0.1.0"
description = "A dual-target Codex pet and deterministic toolchain for Scales from Blender Foundation's Sintel."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{ name = "KanadeK" }]
keywords = ["codex", "pet", "sintel", "scales", "spritesheet", "desktop-pet"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
]
dependencies = ["Pillow>=10.0,<14"]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "coverage[toml]>=7.6",
  "mypy>=1.13",
  "ruff>=0.9",
]

[project.scripts]
scales-pet = "scales_pet.cli:main"

[project.urls]
Homepage = "https://github.com/KanadeK/scales-codex-pet"
Issues = "https://github.com/KanadeK/scales-codex-pet/issues"
Source = "https://github.com/KanadeK/scales-codex-pet"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["scales_pet"]
mypy_path = "src"

[tool.coverage.run]
branch = true
source = ["scales_pet"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
